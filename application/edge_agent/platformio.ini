; KrakBot Nano — PlatformIO project file (pioarduino platform)
;
; This project is a native ESP-IDF component build (idf.py/CMake), not Arduino.
; PlatformIO's "espidf" framework wraps the same CMakeLists.txt/main/ tree used
; by `idf.py build`, so this file lets you build/flash/monitor from the
; PlatformIO extension in VS Code instead of a terminal.
;
; ONE-TIME PREREQUISITE (cannot be skipped, do this once from a terminal):
;   1. Install ESP-IDF v5.5.4 and `. $IDF_PATH/export.sh`
;   2. pip install esp-bmgr-assist
;   3. cd application/edge_agent
;      idf.py bmgr -c ./boards -b esp32_S3_DevKitC_1
;   This generates components/gen_bmgr_codes/ (board glue code) and persists
;   the board selection. Without this step the build will fail: it is not a
;   PlatformIO/pioarduino limitation, the firmware needs this generated code
;   to compile for any board. See docs/src/content/docs/en/reference-project/build-from-source.mdx.
;
; After that one-time step, PlatformIO/pioarduino (VS Code) drives build,
; upload, and monitor on its own — no further idf.py/terminal use required.

; This is a native ESP-IDF component build (CMakeLists.txt at the project
; root + main/ component), not the default PlatformIO "src/" layout.
; src_dir must point at the actual sources so PlatformIO's espidf builder
; can find them; the top-level CMakeLists.txt (which includes
; $IDF_PATH/tools/cmake/project.cmake) still drives the build.
[platformio]
src_dir = main

[env:krakbot-nano]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; esp32-s3-devkitc1-n16r8: matches the ESP32-S3 N16R8 DevKitC-1 target board
; (16 MB flash Quad / 8 MB PSRAM Octal). The generic "esp32-s3-devkitc-1"
; board id defaults to an N8 (8MB flash, no PSRAM) variant, which is wrong
; for this hardware.
board = esp32-s3-devkitc1-n16r8
framework = espidf

; PSRAM mode/speed and flash mode/freq are also set via sdkconfig
; (boards/espressif/esp32_S3_DevKitC_1/sdkconfig.defaults.board), applied
; automatically by esp_board_manager once bmgr has selected the board.
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; When building through `idf.py`, esp_board_manager's idf_ext.py action
; extension injects components/gen_bmgr_codes/board_manager.defaults (the
; per-board sdkconfig overlay written by `idf.py bmgr`/`gen_bmgr_config_codes.py`
; — device/peripheral CONFIG_ESP_BOARD_* symbols, flash size, etc.) into
; SDKCONFIG_DEFAULTS before CMake configures. PlatformIO/pioarduino calls
; CMake directly and never loads idf_ext.py, so that overlay is silently
; skipped: generated board glue code fails to compile (missing
; device/peripheral headers gated by symbols that were never turned on) and
; the flash size falls back to CMake's 2MB default. Re-add the overlay
; explicitly here.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;components/gen_bmgr_codes/board_manager.defaults"

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 921600 and 460800 both caused "Invalid head of packet... possible serial
; noise" over this board's external CH343 USB-serial cable (noise appeared
; even before the baud switch, during stub upload) — cable/adapter quality,
; not just speed. Prefer plugging into the board's native USB-C port
; directly (shows up as "USB JTAG/serial debug unit", VID:PID 303A:1001)
; instead of an external USB-serial adapter; its built-in reset circuitry
; also auto-enters bootloader mode, so no manual BOOT+RESET is needed.
upload_speed = 115200

; esptool's default stub-based flash flow drops the connection ("chip
; stopped responding") right when the stub attaches to flash on this
; board's native ESP32-S3 USB-Serial/JTAG controller — a known interaction
; between the stub upload and the native USB CDC peripheral. --no-stub
; falls back to the ROM bootloader for the whole flash operation, which is
; slower but reliable here. Remove this if a future esptool/toolchain
; update fixes the stub handshake and you want faster uploads.
upload_flags = --no-stub
