; KrakBot Nano — PlatformIO project file (pioarduino platform)
;
; This project is a native ESP-IDF component build (idf.py/CMake), not Arduino.
; PlatformIO's "espidf" framework wraps the same CMakeLists.txt/main/ tree used
; by `idf.py build`, so this file lets you build/flash/monitor from the
; PlatformIO extension in VS Code instead of a terminal.
;
; ONE-TIME PREREQUISITE (cannot be skipped, do this once from a terminal):
;   1. Install ESP-IDF v5.5.4 and `. $IDF_PATH/export.sh`
;   2. pip install esp-bmgr-assist
;   3. cd application/edge_agent
;      idf.py bmgr -c ./boards -b esp32_S3_DevKitC_1
;   This generates components/gen_bmgr_codes/ (board glue code) and persists
;   the board selection. Without this step the build will fail: it is not a
;   PlatformIO/pioarduino limitation, the firmware needs this generated code
;   to compile for any board. See docs/src/content/docs/en/reference-project/build-from-source.mdx.
;
; After that one-time step, PlatformIO/pioarduino (VS Code) drives build,
; upload, and monitor on its own — no further idf.py/terminal use required.

[env:krakbot-nano]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf

; ESP32-S3 N16R8: 16 MB flash / 8 MB octal PSRAM.
; PSRAM mode/speed and flash mode/freq are set via sdkconfig
; (boards/espressif/esp32_S3_DevKitC_1/sdkconfig.defaults.board), applied
; automatically by esp_board_manager once bmgr has selected the board.
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
